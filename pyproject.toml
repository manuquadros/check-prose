[project]
name = "check-prose"
version = "0.1.0"
description = "List long docstrings and comment blocks in the code a diff touches, for review."
authors = [{name = "manu"}]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
check-prose = "check_prose:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "ticketkit @ git+https://github.com/manuquadros/ticketkit@v2.0.1",
]

[tool.pdm.scripts]
test = "pytest"
lint = "ruff check ."
typecheck = "mypy src/"
tickets = "python tickets.py"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
